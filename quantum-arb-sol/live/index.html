<!doctype html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Quantum-Arb-SOL — LIVE paper-trade</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0d1117;color:#e6edf3;padding:14px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:17px;margin:0}
.tag{font-size:11px;color:#8b949e}
.dot{width:10px;height:10px;border-radius:50%;margin-left:auto;background:#c0392b;transition:background .3s}
.dot.on{background:#21c074}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0;padding:11px;background:#161b22;border:1px solid #30363d;border-radius:8px}
label{font-size:12px;color:#8b949e}
input{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:8px 9px;font-family:inherit;font-size:16px;width:110px}
input.sm{width:74px}
button{background:#21c074;color:#04210f;border:none;border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
button.alt{background:#30363d;color:#e6edf3}
.venues{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;font-size:11px}
.vchip{padding:3px 8px;border-radius:20px;border:1px solid #30363d;color:#8b949e}
.vchip.ok{border-color:#21c074;color:#21c074}.vchip.err{border-color:#c0392b;color:#c0392b}
.metrics{font-size:11px;color:#8b949e;margin:8px 0;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.panel{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:13px}
.ptitle{font-size:12px;color:#8b949e;margin-bottom:9px;text-transform:uppercase;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:#8b949e;border-bottom:1px solid #30363d;padding:5px 5px;font-weight:600}
td{padding:5px 5px;border-bottom:1px solid #21262d}
.pos{color:#21c074;font-weight:700}.neg{color:#c0392b}
.pnl{font-size:32px;font-weight:800}.sub{font-size:12px;color:#8b949e;margin-top:3px}
.banner{font-size:11px;color:#8b949e;margin-top:14px;border-top:1px solid #21262d;padding-top:9px;line-height:1.5}
.warn{color:#e3b341}
</style>
</head>
<body>
<div class="head">
  <h1>Quantum-Arb-SOL · LIVE</h1>
  <span class="tag">paper-trade — sem execução real</span>
  <span class="dot" id="dot"></span>
</div>

<div class="controls">
  <label>Montante (USD)</label>
  <input id="notional" type="number" min="1" step="100" inputmode="decimal" value="10000">
  <label>Min edge (bps)</label>
  <input id="minedge" class="sm" type="number" min="0" step="1" value="5">
  <label>Refresh (s)</label>
  <input id="interval" class="sm" type="number" min="3" step="1" value="8">
  <button id="toggle">▶ Start</button>
  <button id="once" class="alt">↻ Agora</button>
  <button id="reset" class="alt">Reset paper</button>
</div>

<div class="venues" id="venues"></div>
<div class="metrics" id="metrics">à espera do primeiro refresh…</div>

<div class="grid">
  <div class="panel"><div class="ptitle">Spreads ao vivo</div>
    <table><thead><tr><th>Par</th><th>Venue</th><th>Bid</th><th>Ask</th></tr></thead><tbody id="spreads"></tbody></table></div>
  <div class="panel"><div class="ptitle">Oportunidades (net bps, net de fees+slippage)</div>
    <table><thead><tr><th>Par</th><th>Buy</th><th>Sell</th><th>Net bps</th></tr></thead><tbody id="opps"></tbody></table></div>
  <div class="panel"><div class="ptitle">Paper PnL acumulado</div>
    <div class="pnl" id="pnl">$0.00</div>
    <div class="sub" id="pnlsub">0 fills · 0 refreshes</div></div>
  <div class="panel"><div class="ptitle">Últimos fills (paper)</div>
    <table><thead><tr><th>Hora</th><th>Par</th><th>Rota</th><th>Net bps</th><th>PnL</th></tr></thead><tbody id="log"></tbody></table></div>
</div>

<div class="banner" id="banner"></div>

<script>
// ===================== Live paper-trade engine (browser) =====================
// Public market data, no auth. Fetches run from YOUR device, so this works even
// where a server's egress policy blocks the exchanges. Mirrors the repo's
// models/slippage.ts + models/arbitrage.ts. No signing, no order execution.

const MINTS = {
  SOL:  {mint:'So11111111111111111111111111111111111111112', dec:9},
  USDC: {mint:'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v', dec:6},
  USDT: {mint:'Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB', dec:6},
};
// Per-pair venue mapping. Jupiter only for Solana-native SOL pairs.
const PAIRS = [
  {key:'SOL/USDC', binance:'SOLUSDC', coinbase:'SOL-USDC', jup:{in:'SOL',out:'USDC'}},
  {key:'SOL/USDT', binance:'SOLUSDT', coinbase:'SOL-USDT', jup:{in:'SOL',out:'USDT'}},
  {key:'BTC/USDC', binance:'BTCUSDC', coinbase:'BTC-USDC'},
  {key:'ETH/USDC', binance:'ETHUSDC', coinbase:'ETH-USDC'},
];
const FEE = {binance:10, coinbase:40, jupiter:0};
const GAS = {jupiter:1};
const SLIP = {
  jupiter:{kLin:0,kSqrt:0,refNotional:1},
  binance:{kLin:.5,kSqrt:3,refNotional:1e4},
  coinbase:{kLin:.8,kSqrt:4,refNotional:1e4},
};
const JUP_PROBE_SOL = 5; // reference size for the executable Jupiter quote

// ---- slippage (mirror of models/slippage.ts) ----
function paramBps(p,n){const q=n/p.refNotional;return p.kLin*q+p.kSqrt*Math.sqrt(q);}
function walkBps(q,side,n){
  const lv=side==='buy'?q.book.asks:q.book.bids, top=side==='buy'?q.ask:q.bid;
  let rem=n,base=0,spent=0;
  for(const l of lv){const ln=l.px*l.sz,t=Math.min(rem,ln);base+=t/l.px;spent+=t;rem-=t;if(rem<=1e-9)break;}
  if(base<=0)return paramBps(SLIP[q.venue],n);
  const avg=spent/base; let bps=Math.abs(avg-top)/top*1e4;
  if(rem>1e-9)bps+=paramBps(SLIP[q.venue],rem);
  return bps;
}
function slipBps(q,side,n){
  if(q.executable)return 0; if(n<=0)return 0;
  if(q.book&&(side==='buy'?q.book.asks.length:q.book.bids.length))return walkBps(q,side,n);
  return paramBps(SLIP[q.venue]||{kLin:1,kSqrt:5,refNotional:1e4},n);
}
// ---- detector (mirror of models/arbitrage.ts) ----
function detect(quotes,notional,minEdge){
  const byPair={};
  for(const q of quotes)(byPair[q.pairKey]=byPair[q.pairKey]||[]).push(q);
  const out=[];
  for(const key in byPair){
    const fresh=byPair[key]; if(fresh.length<2)continue;
    let best=null;
    for(const b of fresh)for(const s of fresh){
      if(b.venue===s.venue)continue;
      const gross=(s.bid-b.ask)/b.ask*1e4;
      const fee=b.feeBps+s.feeBps;
      const slip=slipBps(b,'buy',notional)+slipBps(s,'sell',notional);
      const gas=(GAS[b.venue]||0)+(GAS[s.venue]||0);
      const net=gross-fee-slip-gas;
      if(net>=minEdge&&(!best||net>best.netBps))
        best={pairKey:key,buy:b.venue,sell:s.venue,gross,fee,slip,gas,netBps:net};
    }
    if(best)out.push(best);
  }
  out.sort((a,b)=>a.pairKey<b.pairKey?-1:a.pairKey>b.pairKey?1:0);
  return out;
}

// ---- live fetchers (public endpoints, CORS-enabled) ----
async function fetchBinance(symbol,pairKey){
  const r=await fetch(`https://api.binance.com/api/v3/depth?symbol=${symbol}&limit=20`);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();
  const bids=d.bids.map(x=>({px:+x[0],sz:+x[1]})), asks=d.asks.map(x=>({px:+x[0],sz:+x[1]}));
  return mkQuote('binance',pairKey,bids[0].px,asks[0].px,{bids,asks},false);
}
async function fetchCoinbase(product,pairKey){
  const r=await fetch(`https://api.exchange.coinbase.com/products/${product}/book?level=2`);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();
  const bids=(d.bids||[]).map(x=>({px:+x[0],sz:+x[1]})), asks=(d.asks||[]).map(x=>({px:+x[0],sz:+x[1]}));
  if(!bids.length||!asks.length)throw new Error('empty book');
  return mkQuote('coinbase',pairKey,bids[0].px,asks[0].px,{bids,asks},false);
}
async function fetchJupiter(cfg,pairKey){
  const i=MINTS[cfg.in], o=MINTS[cfg.out];
  const amount=Math.round(JUP_PROBE_SOL*10**i.dec);
  const u=`https://quote-api.jup.ag/v6/quote?inputMint=${i.mint}&outputMint=${o.mint}&amount=${amount}&slippageBps=50&swapMode=ExactIn`;
  const r=await fetch(u); if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();
  const out=(+d.outAmount)/10**o.dec, inn=(+d.inAmount)/10**i.dec, px=out/inn;
  return mkQuote('jupiter',pairKey,px,px,null,true); // executable: impact embedded
}
function mkQuote(venue,pairKey,bid,ask,book,executable){
  return {venue,pairKey,bid,ask,mid:(bid+ask)/2,feeBps:FEE[venue],book,executable};
}

// ---- paper ledger (persists across refreshes) ----
let paper={pnl:0,fills:0,refreshes:0,log:[]};
const venueStatus={};

async function refresh(){
  const notional=Math.max(1,+document.getElementById('notional').value||0);
  const minEdge=Math.max(0,+document.getElementById('minedge').value||0);
  const jobs=[];
  for(const p of PAIRS){
    if(p.binance)jobs.push(tag('binance',fetchBinance(p.binance,p.key)));
    if(p.coinbase)jobs.push(tag('coinbase',fetchCoinbase(p.coinbase,p.key)));
    if(p.jup)jobs.push(tag('jupiter',fetchJupiter(p.jup,p.key)));
  }
  const settled=await Promise.allSettled(jobs);
  const quotes=[];
  for(const k in venueStatus)venueStatus[k]={ok:0,err:0};
  for(const s of settled){
    if(s.status==='fulfilled'){quotes.push(s.value.q);bump(s.value.venue,'ok');}
    else{const v=s.reason&&s.reason.venue;if(v)bump(v,'err');}
  }
  paper.refreshes++;
  renderVenues();
  // spreads
  let srows='';
  const byPair={}; for(const q of quotes)(byPair[q.pairKey]=byPair[q.pairKey]||[]).push(q);
  for(const key in byPair)for(const q of byPair[key])
    srows+=`<tr><td>${key}</td><td>${q.venue}</td><td>${fmt(q.bid)}</td><td>${fmt(q.ask)}</td></tr>`;
  document.getElementById('spreads').innerHTML=srows||'<tr><td colspan="4" class="warn">sem quotes — ver aviso em baixo</td></tr>';
  // opportunities
  const opps=detect(quotes,notional,minEdge);
  let orows='';
  for(const o of opps){
    orows+=`<tr><td>${o.pairKey}</td><td>${o.buy}</td><td>${o.sell}</td><td class="${o.netBps>0?'pos':'neg'}">${o.netBps.toFixed(2)}</td></tr>`;
    // paper-execute this tick
    const pnl=notional*o.netBps/1e4;
    paper.pnl+=pnl; paper.fills++;
    paper.log.unshift({t:new Date().toLocaleTimeString(),pair:o.pairKey,route:o.buy+'→'+o.sell,net:o.netBps,pnl});
  }
  paper.log=paper.log.slice(0,20);
  document.getElementById('opps').innerHTML=orows||`<tr><td colspan="4" style="color:#8b949e">nenhuma ≥ ${minEdge}bps neste tick</td></tr>`;
  // pnl + log
  document.getElementById('pnl').textContent='$'+paper.pnl.toFixed(2);
  document.getElementById('pnl').className='pnl '+(paper.pnl>=0?'pos':'neg');
  document.getElementById('pnlsub').textContent=`${paper.fills} fills · ${paper.refreshes} refreshes · montante $${notional.toLocaleString()}`;
  document.getElementById('log').innerHTML=paper.log.map(f=>
    `<tr><td>${f.t}</td><td>${f.pair}</td><td>${f.route}</td><td class="${f.net>0?'pos':'neg'}">${f.net.toFixed(2)}</td><td class="${f.pnl>0?'pos':'neg'}">$${f.pnl.toFixed(2)}</td></tr>`
  ).join('')||'<tr><td colspan="5" style="color:#8b949e">—</td></tr>';
  document.getElementById('metrics').innerHTML=
    `quotes ${quotes.length} · pares ${Object.keys(byPair).length} · atualizado ${new Date().toLocaleTimeString()}`;
  const anyOk=quotes.length>0;
  if(!anyOk)showBlocked(); else document.getElementById('banner').innerHTML=baseBanner();
}
function tag(venue,promise){return promise.then(q=>({venue,q})).catch(e=>{e.venue=venue;throw e;});}
function bump(v,k){venueStatus[v]=venueStatus[v]||{ok:0,err:0};venueStatus[v][k]++;}
function renderVenues(){
  const order=['binance','coinbase','jupiter'];
  document.getElementById('venues').innerHTML=order.map(v=>{
    const s=venueStatus[v]||{ok:0,err:0};
    const cls=s.ok>0?'ok':(s.err>0?'err':'');
    return `<span class="vchip ${cls}">${v} ${s.ok>0?'●':(s.err>0?'×':'·')} ${s.ok}/${s.ok+s.err}</span>`;
  }).join('');
}
function fmt(n){return n<0.01?n.toExponential(3):n.toLocaleString(undefined,{maximumFractionDigits:n<10?4:2});}
function baseBanner(){return 'Live paper-trade. Cada refresh, oportunidades ≥ min edge são executadas em paper e somadas ao PnL. Net bps já desconta fees + slippage (book real walked). Mesma matemática de models/slippage.ts + models/arbitrage.ts.';}
function showBlocked(){
  document.getElementById('banner').innerHTML='<span class="warn">⚠ Nenhuma venue respondeu.</span> O visualizador pode estar a bloquear pedidos de rede (CSP). '+
   'Solução: descarrega este HTML e abre-o no Safari/Chrome do telemóvel — aí o fetch às exchanges funciona. As APIs (Binance/Coinbase/Jupiter) permitem CORS; o bloqueio, a existir, é da sandbox de pré-visualização.';
}

// ---- controls ----
let timer=null;
function setRunning(on){
  const dot=document.getElementById('dot'), btn=document.getElementById('toggle');
  if(on){dot.classList.add('on');btn.textContent='⏸ Stop';}
  else{dot.classList.remove('on');btn.textContent='▶ Start';}
}
document.getElementById('toggle').onclick=()=>{
  if(timer){clearInterval(timer);timer=null;setRunning(false);return;}
  setRunning(true); refresh();
  const iv=Math.max(3,+document.getElementById('interval').value||8)*1000;
  timer=setInterval(refresh,iv);
};
document.getElementById('once').onclick=refresh;
document.getElementById('reset').onclick=()=>{paper={pnl:0,fills:0,refreshes:0,log:[]};refresh();};
document.getElementById('interval').onchange=()=>{if(timer){clearInterval(timer);document.getElementById('toggle').click();document.getElementById('toggle').click();}};

document.getElementById('banner').innerHTML=baseBanner()+' <br>Carrega ▶ Start para começar (ou ↻ Agora para um tick único).';
// kick one immediate fetch so you see data without waiting
refresh();
</script>
</body>
</html>
